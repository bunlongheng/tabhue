<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
  <defs>
    <clipPath id="win"><rect x="20" y="24" width="720" height="352" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#win)">
    <!-- body, tinted to the active (green) project -->
    <rect x="20" y="24" width="720" height="352" fill="#0e1a12"/>
    <!-- title bar -->
    <rect x="20" y="24" width="720" height="42" fill="#1d1d27"/>
    <circle cx="48" cy="45" r="6" fill="#ff5f57"/>
    <circle cx="70" cy="45" r="6" fill="#febc2e"/>
    <circle cx="92" cy="45" r="6" fill="#28c840"/>
    <text x="380" y="50" text-anchor="middle" fill="#5b5b6a" font-size="13">tabhue</text>
    <!-- tab bar -->
    <rect x="20" y="66" width="720" height="48" fill="#191921"/>
    <g font-size="14" font-weight="700">
      <rect x="34"  y="74" width="162" height="32" rx="8" fill="#34C759"/><text x="115" y="95" text-anchor="middle" fill="#0c2a16">API</text>
      <rect x="206" y="74" width="162" height="32" rx="8" fill="#FFCC00"/><text x="287" y="95" text-anchor="middle" fill="#3a2e00">NOTES</text>
      <rect x="378" y="74" width="162" height="32" rx="8" fill="#2563EB"/><text x="459" y="95" text-anchor="middle" fill="#ffffff">WEB</text>
      <rect x="550" y="74" width="162" height="32" rx="8" fill="#FF3B30"/><text x="631" y="95" text-anchor="middle" fill="#ffffff">DB</text>
    </g>
    <!-- active terminal body -->
    <g font-size="15">
      <text x="46" y="152" fill="#34C759">~/Sites/api</text>
      <text x="172" y="152" fill="#5b5b6a">on main</text>
      <text x="46" y="186" fill="#cfd3da">$ go run .</text>
      <text x="46" y="220" fill="#7f8794">server listening on :8080</text>
      <text x="46" y="262" fill="#34C759">$</text>
      <rect x="60" y="250" width="9" height="16" fill="#34C759" opacity="0.9"/>
    </g>
  </g>
  <rect x="20" y="24" width="720" height="352" rx="16" fill="none" stroke="#2c2c38" stroke-width="1.5"/>
</svg>
